name: AgenteLegal CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: make test
      - name: Compile sources
        env:
          PYTHONPATH: .
        run: make lint
      - name: Validate evidence layout
        run: python scripts/validate_evidence_layout.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t agente-legal:ci .

  retrieval-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline GraphRAG smoke
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_retrieval.py
